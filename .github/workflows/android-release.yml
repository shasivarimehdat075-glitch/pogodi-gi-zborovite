name: Signed Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pogodi-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/pogodi-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          gradle assembleRelease

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk

      - name: Read app version
        run: |
          VERSION_NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
test -n "$VERSION_NAME"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pogodi-Gi-Zborovite-${{ env.VERSION_NAME }}-SIGNED
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish update for in-app updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ env.VERSION_NAME }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false
          draft: false
